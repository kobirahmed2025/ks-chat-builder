<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xan Bestie AI | Chat Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b14;
            --panel-bg: rgba(15, 23, 42, 0.88);
            --header-bg: rgba(30, 41, 59, 0.72);
            --primary: #00f2fe;
            --primary-dark: #0097a7;
            --secondary: #4facfe;
            --user-grad-start: #2563eb;
            --user-grad-end: #0ea5e9;
            --bot-bg: rgba(30, 41, 59, 0.9);
            --border-subtle: rgba(148, 163, 184, 0.16);
            --border-glow: rgba(0, 242, 254, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 242, 254, 0.14) 0%, transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(79, 172, 254, 0.16) 0%, transparent 45%),
                linear-gradient(180deg, #070b14 0%, #0b1222 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Subtle ambient floating orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 9s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 240px;
            height: 240px;
            background: rgba(0, 242, 254, 0.12);
            top: 8%;
            left: 10%;
        }

        .orb-2 {
            width: 280px;
            height: 280px;
            background: rgba(79, 172, 254, 0.12);
            bottom: 8%;
            right: 10%;
            animation-delay: -4s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(18px, -22px) scale(1.08); }
        }

        .chat-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 465px;
            height: 660px;
            max-height: 92vh;
            background: var(--panel-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.7),
                0 0 28px rgba(0, 242, 254, 0.12);
            animation: wrapperEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes wrapperEntrance {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .chat-header {
            background: var(--header-bg);
            padding: 15px 18px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-pulse {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00e676;
            box-shadow: 0 0 10px #00e676;
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.65; }
        }

        .chat-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.8px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-id-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.7);
            padding: 5px 9px;
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
        }

        .user-id-box input {
            width: 92px;
            padding: 4px 7px;
            border-radius: 7px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: #090e1a;
            color: var(--text-main);
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .user-id-box input:focus {
            border-color: var(--primary);
        }

        .messages {
            flex: 1;
            padding: 18px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 13px;
            scroll-behavior: smooth;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.25);
            border-radius: 999px;
        }

        .bubble {
            max-width: 82%;
            padding: 12px 15px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: bubblePop 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes bubblePop {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--user-grad-start), var(--user-grad-end));
            color: #ffffff;
            border-bottom-right-radius: 5px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
        }

        .bubble.bot {
            align-self: flex-start;
            background: var(--bot-bg);
            color: #f1f5f9;
            border: 1px solid var(--border-subtle);
            border-bottom-left-radius: 5px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        }

        .bubble.error {
            align-self: center;
            background: rgba(239, 68, 68, 0.16);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            font-size: 12.5px;
        }

        /* Animated typing indicator */
        .typing-dots {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 4px;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            animation: bounceDot 1.2s infinite ease-in-out;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes bounceDot {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.45;
            }
            40% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        .input-bar {
            padding: 13px 14px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-bar input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 13px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            background: rgba(9, 14, 26, 0.92);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .input-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 242, 254, 0.14);
        }

        .input-bar input::placeholder {
            color: #64748b;
        }

        .btn-3d-send {
            padding: 12px 18px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #04131e;
            font-weight: 700;
            font-size: 13.5px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--primary-dark), 0 8px 18px rgba(0, 242, 254, 0.22);
            transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
        }

        .btn-3d-send:hover:not(:disabled) {
            filter: brightness(1.07);
        }

        .btn-3d-send:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--primary-dark), 0 4px 10px rgba(0, 242, 254, 0.18);
        }

        .btn-3d-send:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="chat-wrapper">
        <div class="chat-header">
            <div class="brand-box">
                <span class="status-pulse"></span>
                <h2>XAN BESTIE AI</h2>
            </div>
            <div class="user-id-box">
                <label for="userIdInput">ID:</label>
                <input type="text" id="userIdInput" value="xan123">
            </div>
        </div>

        <div class="messages" id="messagesBox">
            <div class="bubble bot">Oi Xan jan! Kemon acho? Kotha bolo na!</div>
        </div>

        <form class="input-bar" id="chatForm" onsubmit="sendMessage(event)">
            <input type="text" id="messageInput" placeholder="Write something to Xan AI..." autocomplete="off" required>
            <button type="submit" class="btn-3d-send" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
        const API_BASE = "";

        function addBubble(text, type, isTyping = false) {
            const box = document.getElementById("messagesBox");
            const div = document.createElement("div");
            div.className = "bubble " + type;

            if (isTyping) {
                div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
            } else {
                div.textContent = text;
            }

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return div;
        }

        async function sendMessage(event) {
            event.preventDefault();
            const msgInput = document.getElementById("messageInput");
            const userIdInput = document.getElementById("userIdInput");
            const sendBtn = document.getElementById("sendBtn");

            const message = msgInput.value.trim();
            const userId = userIdInput.value.trim() || "xan123";

            if (!message) return;

            addBubble(message, "user");
            msgInput.value = "";
            sendBtn.disabled = true;

            const typingBubble = addBubble("", "bot", true);

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: message,
                        user_id: userId
                    })
                });

                const data = await res.json();
                typingBubble.remove();

                if (!res.ok || data.error) {
                    addBubble(data.error || "Something went wrong.", "error");
                } else {
                    addBubble(data.reply, "bot");
                }
            } catch (err) {
                typingBubble.remove();
                addBubble("Network error while reaching /chat.", "error");
            } finally {
                sendBtn.disabled = false;
                msgInput.focus();
            }
        }
    </script>
</body>
</html>
